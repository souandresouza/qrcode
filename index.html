<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor e Gerador de QR Code</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
    body {
        font-family: 'Roboto Mono', monospace;
        transition: background-color 0.5s, color 0.5s; /* Smooth transition */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        text-align: center;
        background-color: inherit; /* Use body's background color */
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    input[type="text"], input[type="file"] {
        width: 100%;
        max-width: 300px;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 4px;
        border: 1px solid #ccc;
    }

    button {
        padding: 10px 20px;
        background-color: #4caf50; /* Green color remains */
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-bottom: 20px;
    }

    button:hover {
        background-color: #45a049;
    }

    canvas {
        margin-top: 20px;
        border: 1px solid #ccc;
    }

    #qrResult {
        margin-top: 20px;
        font-size: 1.2em;
    }

    @media (max-width: 600px) {
        .container {
            width: 95%;
        }
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>Leitor e Gerador de QR Code</h1>
        <div class="qr-generator">
            <input type="text" id="qrInput" placeholder="Digite o texto para gerar QR Code">
            <button id="generateBtn">Gerar QR Code</button>
            <canvas id="qrCanvas"></canvas>
            <button id="saveBtn" style="display: none;">Salvar QR Code</button>
        </div>
        <div class="qr-reader">
            <input type="file" id="qrFile" accept="image/*">
            <button id="readBtn">Ler QR Code</button>
            <div id="qrResult"></div>
        </div>
    </div>
    <script>
    function applyThemeBasedOnTime() {
        const currentHour = new Date().getHours();
        const body = document.body;

        if (currentHour >= 6 && currentHour < 18) {
            // Light theme
            body.style.backgroundColor = '#fff';
            body.style.color = '#000';
        } else {
            // Dark theme
            body.style.backgroundColor = '#000';
            body.style.color = '#fff';
        }
    }

    // Apply theme on page load
    applyThemeBasedOnTime();

    document.getElementById('generateBtn').addEventListener('click', function() {
        const qrInput = document.getElementById('qrInput').value.trim();
        const qrCanvas = document.getElementById('qrCanvas');
        const qrResult = document.getElementById('qrResult');
        const generateBtn = document.getElementById('generateBtn');

        if (qrInput) {
            qrResult.textContent = 'Gerando QR Code...';
            QRCode.toCanvas(qrCanvas, qrInput, function(error) {
                if (error) {
                    console.error(error);
                    qrResult.textContent = 'Erro ao gerar QR Code.';
                } else {
                    qrResult.textContent = 'QR Code gerado com sucesso!';
                    generateBtn.style.display = 'none'; // Hide the generate button
                    document.getElementById('saveBtn').style.display = 'block'; // Show save button
                }
            });
        } else {
            qrResult.textContent = 'Por favor, digite o texto para gerar QR Code.';
        }
    });

    document.getElementById('saveBtn').addEventListener('click', function() {
        const qrCanvas = document.getElementById('qrCanvas');
        const link = document.createElement('a');
        link.href = qrCanvas.toDataURL('image/png');
        link.download = 'QRCode-0001.png';
        link.click();
        alert('QR Code salvo. Verifique sua pasta de Downloads no PC ou Galeria no celular.');
    });

    document.getElementById('readBtn').addEventListener('click', function() {
        const qrFile = document.getElementById('qrFile').files[0];
        const qrResult = document.getElementById('qrResult');

        if (qrFile) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    context.drawImage(img, 0, 0, img.width, img.height);

                    const imageData = context.getImageData(0, 0, img.width, img.height);
                    const qrCode = jsQR(imageData.data, img.width, img.height);
                    if (qrCode) {
                        qrResult.textContent = `Conteúdo do QR Code: ${qrCode.data}`;
                        if (qrCode.data.length > 50) { // Verificar se o texto é grande
                            const textLink = document.createElement('a');
                            const blob = new Blob([qrCode.data], { type: 'text/plain' });
                            textLink.href = URL.createObjectURL(blob);
                            textLink.download = 'QRCode-text0001.txt';
                            textLink.click();
                        }
                    } else {
                        qrResult.textContent = 'Nenhum QR Code encontrado.';
                    }
                };
                img.src = event.target.result;
            };
            reader.onerror = function() {
                qrResult.textContent = 'Erro ao ler o arquivo de QR Code.';
            };
            reader.readAsDataURL(qrFile);
        } else {
            qrResult.textContent = 'Por favor, selecione um arquivo de imagem de QR Code.';
        }
    });
    </script>
</body>
</html>
